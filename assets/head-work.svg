<radialGradient id="b1"><stop offset="0" stop-color="#915EFF" stop-opacity=".35"/><stop offset="1" stop-color="#915EFF" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#00cea8" stop-opacity=".18"/><stop offset="1" stop-color="#00cea8" stop-opacity="0"/></radialGradient>
