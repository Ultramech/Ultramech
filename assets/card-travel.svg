<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 420" width="290" height="420" role="img" aria-label="AI Travel Planner">
<style>
text{font-family:Poppins,Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00cea8"/><stop offset="1" stop-color="#915EFF"/></linearGradient>
<linearGradient id="vl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#915EFF"/><stop offset="1" stop-color="#915EFF" stop-opacity="0"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#915EFF" stop-opacity=".35"/><stop offset="1" stop-color="#915EFF" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#00cea8" stop-opacity=".18"/><stop offset="1" stop-color="#00cea8" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="290" height="420" rx="22" fill="#050816"/>
<rect x="2" y="2" width="286" height="416" rx="22" fill="#151030" stroke="#915EFF" stroke-opacity=".55" stroke-width="1.5"/><defs><linearGradient id="ph" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#915EFF" stop-opacity=".25"/></linearGradient><clipPath id="pc"><rect x="18" y="18" width="254" height="150" rx="14"/></clipPath></defs><rect x="18" y="18" width="254" height="150" rx="14" fill="url(#ph)"/><g clip-path="url(#pc)"><circle class="tw" cx="45" cy="160" r="1.2" fill="#fff" style="animation-delay:-3.0s"/><circle class="tw" cx="184" cy="147" r="1.2" fill="#fff" style="animation-delay:-1.1s"/><circle class="tw" cx="74" cy="95" r="0.6" fill="#fff" style="animation-delay:-1.1s"/><circle class="tw" cx="21" cy="64" r="0.9" fill="#fff" style="animation-delay:-2.4s"/><circle class="tw" cx="236" cy="25" r="0.9" fill="#fff" style="animation-delay:-0.3s"/><circle class="tw" cx="170" cy="12" r="0.9" fill="#fff" style="animation-delay:-2.6s"/><circle class="tw" cx="145" cy="96" r="0.9" fill="#fff" style="animation-delay:-0.7s"/><circle class="tw" cx="257" cy="71" r="0.9" fill="#fff" style="animation-delay:-1.8s"/><circle class="tw" cx="102" cy="84" r="0.9" fill="#fff" style="animation-delay:-2.7s"/><circle class="tw" cx="179" cy="47" r="0.9" fill="#fff" style="animation-delay:-2.9s"/><circle class="tw" cx="118" cy="18" r="0.6" fill="#fff" style="animation-delay:-1.0s"/><circle class="tw" cx="39" cy="104" r="0.6" fill="#fff" style="animation-delay:-2.6s"/><circle class="tw" cx="83" cy="84" r="0.6" fill="#fff" style="animation-delay:-2.9s"/><circle class="tw" cx="258" cy="18" r="1.2" fill="#fff" style="animation-delay:-1.6s"/></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.6s" begin="-0s" repeatCount="indefinite"/><text x="145" y="115" text-anchor="middle" font-size="64">✈️</text></g><circle cx="248" cy="42" r="16" fill="#000" fill-opacity=".6"/><text x="248" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">↗</text><text x="22" y="205" font-size="22" font-weight="700" fill="#fff">AI Travel Planner</text><text x="22" y="238" font-size="13" fill="#aaa6c3">LangGraph agent with a human</text><text x="22" y="259" font-size="13" fill="#aaa6c3">in the loop. Searches flights,</text><text x="22" y="280" font-size="13" fill="#aaa6c3">trains, buses and cabs in parallel,</text><text x="22" y="301" font-size="13" fill="#aaa6c3">then plans around the weather.</text><text x="22" y="388" font-size="13" font-weight="600" fill="#38bdf8">#langgraph</text><text x="104.0" y="388" font-size="13" font-weight="600" fill="#00cea8">#fastapi</text><text x="172.0" y="388" font-size="13" font-weight="600" fill="#f472b6">#kafka</text></svg>