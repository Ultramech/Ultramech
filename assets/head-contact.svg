<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-label="Contact.">
<style>
text{font-family:Poppins,Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
